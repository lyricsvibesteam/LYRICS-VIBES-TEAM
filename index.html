<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LVT Competition</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(145deg,#03101c,#0b2b49,#03101c);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:460px;
    background:#061827;
    border:1px solid #c9a52b;
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 20px 60px #000;
}

.logo{
    text-align:center;
    color:#d8b63f;
    font-weight:bold;
    letter-spacing:4px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    font-size:28px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#aebdca;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

label{
    display:block;
    color:#d8b63f;
    font-weight:bold;
    font-size:14px;
    margin-bottom:8px;
}

input,select{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #42627b;
    background:#0a2439;
    color:white;
    font-size:16px;
    margin-bottom:18px;
    outline:none;
}

input:focus,select:focus{
    border-color:#d8b63f;
}

.btn{
    width:100%;
    padding:16px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#c9a52b,#f0d46a);
    color:#071521;
    font-weight:bold;
    font-size:15px;
}

.error{
    display:none;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    text-align:center;
    background:#4b1717;
    color:#ffb0b0;
    font-size:13px;
}

.error.show{
    display:block;
}

#selectionScreen{
    display:none;
}

.numbers{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:10px 0 22px;
}

.number{
    height:62px;
    border-radius:15px;
    border:1px solid #48677e;
    background:#0b2940;
    color:white;
    font-size:21px;
    font-weight:bold;
}

.number.selected{
    background:#d8b63f;
    color:#071521;
    border-color:#f5dc72;
}

.number.used{
    background:#242b30;
    color:#69747c;
    cursor:not-allowed;
}

.number:disabled{
    cursor:not-allowed;
}

.result{
    display:none;
    margin-top:22px;
    padding:22px;
    text-align:center;
    border-radius:16px;
    border:1px solid #c9a52b;
    background:#102c40;
}

.result.show{
    display:block;
}

.result small{
    color:#aebdca;
}

.result strong{
    display:block;
    color:#f0d46a;
    font-size:25px;
    margin-top:8px;
}

.status{
    text-align:center;
    color:#9db0be;
    font-size:13px;
    margin-top:17px;
}

.locked{
    text-align:center;
    color:#d8b63f;
    font-size:13px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="card">

<!-- ================= LOGIN ================= -->

<div id="loginScreen">

    <div class="logo">LVT COMPETITION</div>

    <h1>Private Access</h1>

    <div class="subtitle">
        Enter your name and personal password to continue.
    </div>

    <div id="loginError" class="error"></div>

    <label>Your Name</label>

    <select id="loginName">
        <option value="">Select your name</option>
        <option>Mar’atussaliha</option>
        <option>Auntyn Yara</option>
        <option>Zahraty</option>
        <option>Cutieteemah Lyrics</option>
        <option>Autah Lyrics</option>
        <option>Teemarluvly</option>
        <option>Merhmerh Lyrics</option>
        <option>Queenjurry</option>
    </select>

    <label>Password</label>

    <input
        id="loginPassword"
        type="password"
        placeholder="Enter your password"
    >

    <button class="btn" onclick="login()">
        ENTER COMPETITION
    </button>

</div>


<!-- ================= SELECTION ================= -->

<div id="selectionScreen">

    <div class="logo">LVT COMPETITION</div>

    <h1>Private Selection</h1>

    <div class="subtitle">
        Welcome, <strong id="welcomeName"></strong>.<br>
        Choose one number.
    </div>

    <label>Select Number</label>

    <div id="numbers" class="numbers"></div>

    <button
        id="confirmBtn"
        class="btn"
        disabled
        onclick="confirmSelection()"
    >
        CONFIRM SELECTION
    </button>

    <div id="result" class="result">

        <small>Your selected partner is:</small>

        <strong id="partner"></strong>

    </div>

    <div id="status" class="status"></div>

    <div class="locked">
        Your selection can only be made once.
    </div>

</div>

</div>


<script>

/* ==========================================
   USERS + PASSWORDS
   ========================================== */

const users = {

    "Mar’atussaliha": "LVT-MAR01",

    "Auntyn Yara": "LVT-AUN02",

    "Zahraty": "LVT-ZAH03",

    "Cutieteemah Lyrics": "LVT-CUT04",

    "Autah Lyrics": "LVT-AUT05",

    "Teemarluvly": "LVT-TEE06",

    "Merhmerh Lyrics": "LVT-MER07",

    "Queenjurry": "LVT-QUE08"

};


/* ==========================================
   HIDDEN MALE PARTNERS
   ========================================== */

const men = [

    "Bakori Lyrics",
    "Bash Lyrics",
    "Yusufa Lyrics",
    "Jagora Lyrics",
    "Alkhaddab Lyrics",
    "King Haidar Lyrics",
    "Abbas Lyrics",
    "IBB Lyrics"

];


/* ==========================================
   SESSION
   ========================================== */

let currentUser = "";
let selectedNumber = null;


/*
IMPORTANT:
We use a NEW storage key so old test selections
will NOT appear in this new version.
*/

const STORAGE_KEY = "LVT_TODAY_SELECTION_V2";


let data =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY) ||
        '{"used":[],"users":[]}'
    );


/* ==========================================
   LOGIN
   ========================================== */

function login(){

    const name =
        document.getElementById("loginName").value;

    const password =
        document.getElementById("loginPassword").value;

    const error =
        document.getElementById("loginError");


    error.classList.remove("show");


    if(!name || !password){

        error.textContent =
            "Please select your name and enter your password.";

        error.classList.add("show");

        return;
    }


    if(users[name] !== password){

        error.textContent =
            "Incorrect name or password.";

        error.classList.add("show");

        return;
    }


    /*
    CHECK IF THIS WOMAN HAS ALREADY SELECTED
    */

    if(data.users.includes(name)){

        error.textContent =
            "You have already completed your selection.";

        error.classList.add("show");

        return;
    }


    currentUser = name;


    document.getElementById("loginScreen")
        .style.display = "none";


    document.getElementById("selectionScreen")
        .style.display = "block";


    document.getElementById("welcomeName")
        .textContent = name;


    createNumbers();

}


/* ==========================================
   CREATE NUMBERS
   ========================================== */

function createNumbers(){

    const container =
        document.getElementById("numbers");

    container.innerHTML = "";


    for(let i=1;i<=8;i++){

        const button =
            document.createElement("button");

        button.className = "number";

        button.textContent = i;


        if(data.used.includes(i)){

            button.classList.add("used");

            button.disabled = true;

        }else{

            button.onclick =
                () => selectNumber(i);

        }


        container.appendChild(button);

    }


    updateStatus();

}


/* ==========================================
   SELECT NUMBER
   ========================================== */

function selectNumber(number){

    if(data.used.includes(number)){
        return;
    }


    selectedNumber = number;


    document
        .querySelectorAll(".number")
        .forEach(button => {

            button.classList.remove("selected");

        });


    document
        .querySelectorAll(".number")[number-1]
        .classList.add("selected");


    document
        .getElementById("confirmBtn")
        .disabled = false;

}


/* ==========================================
   CONFIRM SELECTION
   ========================================== */

function confirmSelection(){

    if(!currentUser || !selectedNumber){
        return;
    }


    /*
    CHECK AGAIN BEFORE SAVING
    */

    if(data.used.includes(selectedNumber)){

        alert(
            "Sorry, this number has already been selected."
        );

        createNumbers();

        return;
    }


    if(data.users.includes(currentUser)){

        alert(
            "You have already completed your selection."
        );

        return;
    }


    /*
    SAVE
    */

    data.used.push(selectedNumber);

    data.users.push(currentUser);


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );


    /*
    REVEAL PARTNER
    */

    const partner =
        men[selectedNumber - 1];


    document.getElementById("partner")
        .textContent = partner;


    document.getElementById("result")
        .classList.add("show");


    /*
    LOCK EVERYTHING
    */

    document.getElementById("confirmBtn")
        .disabled = true;


    document
        .querySelectorAll(".number")
        .forEach(button => {

            button.disabled = true;

        });


    updateStatus();

}


/* ==========================================
   STATUS
   ========================================== */

function updateStatus(){

    const available =
        8 - data.used.length;


    document.getElementById("status")
        .textContent =
        available +
        (available === 1
            ? " number available"
            : " numbers available");

}

</script>

</body>
</html>
