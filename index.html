<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LVT Lyrics Competition</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#123b60 0%,#061522 48%,#02070c 100%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:460px;
    background:rgba(5,18,30,.97);
    border:1px solid rgba(212,175,55,.65);
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
    text-align:center;
    color:#d4af37;
    font-size:15px;
    font-weight:bold;
    letter-spacing:4px;
    margin-bottom:8px;
}

h1{
    text-align:center;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aebdca;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

label{
    display:block;
    color:#d4af37;
    font-weight:bold;
    font-size:14px;
    margin-bottom:8px;
}

select,
input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #36536b;
    background:#0b2235;
    color:white;
    font-size:16px;
    outline:none;
    margin-bottom:18px;
}

select:focus,
input:focus{
    border-color:#d4af37;
}

.main-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:13px;
    background:linear-gradient(135deg,#d4af37,#f0d46a);
    color:#071521;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.main-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.error{
    display:none;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    text-align:center;
    background:rgba(190,50,50,.15);
    color:#ffaaaa;
    font-size:13px;
}

.error.show{
    display:block;
}

#selectionScreen{
    display:none;
}

.numbers{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:10px 0 22px;
}

.number{
    height:62px;
    border-radius:15px;
    border:1px solid #49677f;
    background:#0c263b;
    color:white;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    position:relative;
}

.number:hover:not(:disabled){
    border-color:#d4af37;
    transform:translateY(-2px);
}

.number.selected{
    background:#d4af37;
    color:#071521;
    border-color:#f2d675;
    box-shadow:0 0 18px rgba(212,175,55,.3);
}

.number.locked{
    background:#222a2f;
    color:#68737b;
    border-color:#343c41;
    cursor:not-allowed;
}

.number.locked::after{
    content:"LOCKED";
    position:absolute;
    left:0;
    right:0;
    bottom:5px;
    font-size:7px;
    letter-spacing:1px;
}

.result{
    display:none;
    margin-top:22px;
    padding:22px;
    text-align:center;
    border-radius:16px;
    background:rgba(212,175,55,.10);
    border:1px solid rgba(212,175,55,.5);
}

.result.show{
    display:block;
}

.result small{
    display:block;
    color:#aebdca;
    margin-bottom:8px;
}

.result strong{
    display:block;
    color:#f0d46a;
    font-size:25px;
}

.status{
    text-align:center;
    margin-top:18px;
    color:#9db0be;
    font-size:13px;
}

.warning{
    text-align:center;
    margin-top:10px;
    color:#7f929f;
    font-size:11px;
    line-height:1.5;
}

.success{
    color:#b8e6c1;
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<div class="card">

<!-- ================= LOGIN ================= -->

<div id="loginScreen">

    <div class="logo">LVT COMPETITION</div>

    <h1>Private Access</h1>

    <div class="subtitle">
        Enter your name and personal password to continue.
    </div>

    <div id="loginError" class="error"></div>

    <label>Your Name</label>

    <select id="loginName">
        <option value="">Select your name</option>

        <option>Mar’atussaliha</option>
        <option>Auntyn Yara</option>
        <option>Zahraty</option>
        <option>Cutieteemah Lyrics</option>
        <option>Autah Lyrics</option>
        <option>Teemarluvly</option>
        <option>Ameenatou Lyrics</option>
        <option>Queenjurry Lyrics</option>
    </select>

    <label>Password</label>

    <input
        id="loginPassword"
        type="password"
        placeholder="Enter your password"
    >

    <button class="main-btn" onclick="login()">
        ENTER COMPETITION
    </button>

</div>


<!-- ================= SELECTION ================= -->

<div id="selectionScreen">

    <div class="logo">LVT COMPETITION</div>

    <h1>Private Selection</h1>

    <div class="subtitle">
        Welcome, <strong id="welcomeName"></strong>.<br>
        Select one available number.
    </div>

    <label>Select Number</label>

    <div id="numbers" class="numbers"></div>

    <button
        id="confirmBtn"
        class="main-btn"
        disabled
        onclick="confirmSelection()"
    >
        CONFIRM SELECTION
    </button>

    <div id="result" class="result">

        <small>Your selected partner is:</small>

        <strong id="partner"></strong>

    </div>

    <div id="status" class="status"></div>

    <div class="warning">
        Numbers already selected are locked and cannot be chosen.
    </div>

</div>

</div>


<script>

/* ==================================================
   PARTICIPANTS + PASSWORDS
   ================================================== */

const users = {

    "Mar’atussaliha": "LVT-MAR01",

    "Auntyn Yara": "LVT-AUN02",

    "Zahraty": "LVT-ZAH03",

    "Cutieteemah Lyrics": "LVT-CUT04",

    "Autah Lyrics": "LVT-AUT05",

    "Teemarluvly": "LVT-TEE06",

    "Ameenatou Lyrics": "LVT-AME07",

    "Queenjurry Lyrics": "LVT-QUE08"

};


/* ==================================================
   HIDDEN MALE PARTNERS
   ================================================== */

const men = {

    1: "Bakori Lyrics",

    2: "Bash Lyrics",

    3: "Yusufa Lyrics",

    4: "Jagora Lyrics",

    5: "Alkhaddab Lyrics",

    6: "King Haidar Lyrics",

    7: "Abbas Lyrics",

    8: "IBB Lyrics"

};


/* ==================================================
   NUMBERS ALREADY SELECTED
   ==================================================

   1,2,3,4,5,7,8 = LOCKED
   6 = AVAILABLE
   ================================================== */

const lockedNumbers = [
    1,
    2,
    3,
    4,
    5,
    7,
    8
];


/* ==================================================
   STORAGE
   ================================================== */

const STORAGE_KEY =
    "LVT_SELECTION_FINAL_2026";


let savedData =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
        || '{"completedUsers":[],"selectedNumbers":[1,2,3,4,5,7,8]}'
    );


/*
Make sure the already-selected numbers
are always locked.
*/

lockedNumbers.forEach(number => {

    if(!savedData.selectedNumbers.includes(number)){

        savedData.selectedNumbers.push(number);

    }

});


let currentUser = "";

let selectedNumber = null;


/* ==================================================
   LOGIN
   ================================================== */

function login(){

    const name =
        document.getElementById("loginName").value;

    const password =
        document.getElementById("loginPassword").value;

    const error =
        document.getElementById("loginError");


    error.classList.remove("show");


    if(!name || !password){

        error.textContent =
            "Please select your name and enter your password.";

        error.classList.add("show");

        return;
    }


    if(users[name] !== password){

        error.textContent =
            "Incorrect name or password.";

        error.classList.add("show");

        return;
    }


    /*
    If this participant has already selected,
    do not allow another selection.
    */

    if(savedData.completedUsers.includes(name)){

        error.textContent =
            "You have already completed your selection.";

        error.classList.add("show");

        return;
    }


    currentUser = name;


    document
        .getElementById("loginScreen")
        .style.display = "none";


    document
        .getElementById("selectionScreen")
        .style.display = "block";


    document
        .getElementById("welcomeName")
        .textContent = name;


    createNumbers();

}


/* ==================================================
   CREATE NUMBER BUTTONS
   ================================================== */

function createNumbers(){

    const container =
        document.getElementById("numbers");

    container.innerHTML = "";

    selectedNumber = null;


    for(let i = 1; i <= 8; i++){

        const button =
            document.createElement("button");


        button.className = "number";


        button.textContent = i;


        /*
        LOCKED NUMBER
        */

        if(savedData.selectedNumbers.includes(i)){

            button.classList.add("locked");

            button.disabled = true;

        }


        /*
        AVAILABLE NUMBER
        */

        else{

            button.onclick = function(){

                selectNumber(i);

            };

        }


        container.appendChild(button);

    }


    updateStatus();

}


/* ==================================================
   SELECT NUMBER
   ================================================== */

function selectNumber(number){

    if(savedData.selectedNumbers.includes(number)){

        return;

    }


    selectedNumber = number;


    document
        .querySelectorAll(".number")
        .forEach(button => {

            button.classList.remove("selected");

        });


    document
        .querySelectorAll(".number")[number - 1]
        .classList.add("selected");


    document
        .getElementById("confirmBtn")
        .disabled = false;

}


/* ==================================================
   CONFIRM SELECTION
   ================================================== */

function confirmSelection(){

    if(!currentUser){

        return;

    }


    if(!selectedNumber){

        return;

    }


    /*
    DOUBLE CHECK
    */

    if(savedData.selectedNumbers.includes(selectedNumber)){

        alert(
            "Sorry, this number has already been selected."
        );

        createNumbers();

        return;

    }


    /*
    CHECK PARTICIPANT
    */

    if(savedData.completedUsers.includes(currentUser)){

        alert(
            "You have already completed your selection."
        );

        return;

    }


    /*
    SAVE NUMBER
    */

    savedData.selectedNumbers.push(
        selectedNumber
    );


    /*
    SAVE PARTICIPANT
    */

    savedData.completedUsers.push(
        currentUser
    );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(savedData)
    );


    /*
    REVEAL PARTNER
    */

    document
        .getElementById("partner")
        .textContent =
        men[selectedNumber];


    document
        .getElementById("result")
        .classList.add("show");


    /*
    LOCK ALL BUTTONS
    */

    document
        .querySelectorAll(".number")
        .forEach(button => {

            button.disabled = true;

        });


    document
        .getElementById("confirmBtn")
        .disabled = true;


    updateStatus();

}


/* ==================================================
   STATUS
   ================================================== */

function updateStatus(){

    const available =
        8 - savedData.selectedNumbers.length;


    if(available <= 0){

        document
            .getElementById("status")
            .textContent =
            "All numbers have been selected.";

        return;

    }


    document
        .getElementById("status")
        .textContent =
        available +
        (available === 1
            ? " number available"
            : " numbers available");

}


/* ==================================================
   SAVE CURRENT DATA
   ================================================== */

localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(savedData)
);

</script>

</body>
</html>
