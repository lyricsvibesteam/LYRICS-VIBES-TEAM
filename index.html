<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LVT Competition Selection</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:radial-gradient(circle at top,#123d68,#061522 50%,#02070c);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:460px;
    background:rgba(5,18,30,.97);
    border:1px solid rgba(212,175,55,.55);
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    color:#d4af37;
    font-weight:bold;
    letter-spacing:4px;
    margin-bottom:8px;
}

h1{
    text-align:center;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aebdca;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

label{
    display:block;
    color:#d4af37;
    font-weight:bold;
    font-size:14px;
    margin-bottom:8px;
}

input,select{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #36536b;
    background:#0b2235;
    color:white;
    font-size:16px;
    outline:none;
    margin-bottom:18px;
}

button{
    cursor:pointer;
}

.main-btn{
    width:100%;
    padding:16px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#d4af37,#f0d46a);
    color:#071521;
    font-weight:800;
    font-size:15px;
}

.main-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.error{
    display:none;
    color:#ffaaaa;
    background:rgba(190,50,50,.15);
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:13px;
    margin-bottom:15px;
}

.error.show{
    display:block;
}

#selectionScreen{
    display:none;
}

.numbers{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:10px 0 22px;
}

.number{
    height:62px;
    border-radius:15px;
    border:1px solid #49677f;
    background:#0c263b;
    color:white;
    font-size:21px;
    font-weight:bold;
}

.number:hover:not(:disabled){
    border-color:#d4af37;
}

.number.selected{
    background:#d4af37;
    color:#071521;
    border-color:#f2d675;
}

.number.used{
    background:#20272c;
    color:#68737b;
    cursor:not-allowed;
}

.result{
    display:none;
    margin-top:22px;
    padding:22px;
    text-align:center;
    border-radius:16px;
    background:rgba(212,175,55,.10);
    border:1px solid rgba(212,175,55,.45);
}

.result.show{
    display:block;
}

.result small{
    color:#aebdca;
}

.result strong{
    display:block;
    color:#f0d46a;
    font-size:25px;
    margin-top:8px;
}

.status{
    text-align:center;
    color:#9db0be;
    font-size:13px;
    margin-top:17px;
}

.note{
    text-align:center;
    color:#637785;
    font-size:12px;
    margin-top:9px;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div class="card">

    <!-- LOGIN -->
    <div id="loginScreen">

        <div class="logo">LVT COMPETITION</div>

        <h1>Private Access</h1>

        <div class="subtitle">
            Enter your name and personal password to continue.
        </div>

        <div id="loginError" class="error">
            Incorrect name or password.
        </div>

        <label>Your Name</label>

        <select id="loginName">
            <option value="">Select your name</option>
            <option>Mar’atussaliha</option>
            <option>Auntyn Yara</option>
            <option>Zahraty</option>
            <option>Cutieteemah Lyrics</option>
            <option>Autah Lyrics</option>
            <option>Teemarluvly</option>
            <option>Merhmerh Lyrics</option>
            <option>Queenjurry</option>
        </select>

        <label>Password</label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
        >

        <button class="main-btn" onclick="login()">
            ENTER COMPETITION
        </button>

    </div>


    <!-- SELECTION -->
    <div id="selectionScreen">

        <div class="logo">LVT COMPETITION</div>

        <h1>Private Selection</h1>

        <div class="subtitle">
            Welcome, <strong id="welcomeName"></strong>.
            Select one available number.
        </div>

        <label>Select Number</label>

        <div class="numbers" id="numbers"></div>

        <button
            id="confirmBtn"
            class="main-btn"
            disabled
            onclick="confirmSelection()"
        >
            CONFIRM SELECTION
        </button>

        <div id="result" class="result">
            <small>Your selected partner is:</small>
            <strong id="partner"></strong>
        </div>

        <div id="status" class="status">
            8 numbers available
        </div>

        <div class="note">
            Your selection can only be made once on this device.
        </div>

    </div>

</div>


<script>

/* =========================================
   LVT FEMALE PASSWORDS
   ========================================= */

const users = {

    "Mar’atussaliha": "LVT-MAR01",

    "Auntyn Yara": "LVT-AUN02",

    "Zahraty": "LVT-ZAH03",

    "Cutieteemah Lyrics": "LVT-CUT04",

    "Autah Lyrics": "LVT-AUT05",

    "Teemarluvly": "LVT-TEE06",

    "Merhmerh Lyrics": "LVT-MER07",

    "Queenjurry": "LVT-QUE08"

};


/* =========================================
   HIDDEN MALE NAMES
   ========================================= */

const men = [

    "Bakori Lyrics",

    "Bash Lyrics",

    "Yusufa Lyrics",

    "Jagora Lyrics",

    "Alkhaddab Lyrics",

    "King Haidar Lyrics",

    "Abbas Lyrics",

    "IBB Lyrics"

];


/* =========================================
   SYSTEM VARIABLES
   ========================================= */

let currentUser = "";

let selectedNumber = null;

let usedNumbers =
    JSON.parse(
        localStorage.getItem("LVT_USED_NUMBERS") || "[]"
    );

let completedUsers =
    JSON.parse(
        localStorage.getItem("LVT_COMPLETED_USERS") || "[]"
    );


/* =========================================
   LOGIN
   ========================================= */

function login(){

    const name =
        document.getElementById("loginName").value;

    const password =
        document.getElementById("loginPassword").value;

    const error =
        document.getElementById("loginError");


    if(!name || !password){

        error.textContent =
            "Please select your name and enter your password.";

        error.classList.add("show");

        return;
    }


    if(
        users[name] &&
        users[name] === password
    ){

        if(completedUsers.includes(name)){

            error.textContent =
                "This participant has already completed a selection.";

            error.classList.add("show");

            return;
        }


        currentUser = name;


        document
            .getElementById("loginScreen")
            .classList.add("hidden");


        document
            .getElementById("selectionScreen")
            .style.display = "block";


        document
            .getElementById("welcomeName")
            .textContent = name;


        createNumbers();

    }else{

        error.textContent =
            "Incorrect name or password.";

        error.classList.add("show");

    }

}


/* =========================================
   CREATE NUMBERS
   ========================================= */

function createNumbers(){

    const container =
        document.getElementById("numbers");

    container.innerHTML = "";

    selectedNumber = null;

    document
        .getElementById("confirmBtn")
        .disabled = true;


    for(let i=1;i<=8;i++){

        const btn =
            document.createElement("button");

        btn.className = "number";

        btn.textContent = i;


        if(usedNumbers.includes(i)){

            btn.classList.add("used");

            btn.disabled = true;

        }else{

            btn.onclick = function(){

                selectNumber(i);

            };

        }


        container.appendChild(btn);

    }


    updateStatus();

}


/* =========================================
   SELECT NUMBER
   ========================================= */

function selectNumber(number){

    if(usedNumbers.includes(number)){
        return;
    }

    selectedNumber = number;


    document
        .querySelectorAll(".number")
        .forEach(btn => {

            btn.classList.remove("selected");

        });


    document
        .querySelectorAll(".number")[number-1]
        .classList.add("selected");


    document
        .getElementById("confirmBtn")
        .disabled = false;

}


/* =========================================
   CONFIRM
   ========================================= */

function confirmSelection(){

    if(!currentUser || !selectedNumber){
        return;
    }


    if(
        usedNumbers.includes(selectedNumber)
    ){

        alert(
            "Sorry, this number is already selected."
        );

        createNumbers();

        return;
    }


    if(
        completedUsers.includes(currentUser)
    ){

        alert(
            "You have already completed your selection."
        );

        return;
    }


    /*
      SAVE NUMBER
    */

    usedNumbers.push(selectedNumber);


    completedUsers.push(currentUser);


    localStorage.setItem(
        "LVT_USED_NUMBERS",
        JSON.stringify(usedNumbers)
    );


    localStorage.setItem(
        "LVT_COMPLETED_USERS",
        JSON.stringify(completedUsers)
    );


    /*
      REVEAL PARTNER
    */

    const partner =
        men[selectedNumber - 1];


    document
        .getElementById("partner")
        .textContent = partner;


    document
        .getElementById("result")
        .classList.add("show");


    /*
      LOCK EVERYTHING
    */

    document
        .getElementById("confirmBtn")
        .disabled = true;


    document
        .querySelectorAll(".number")
        .forEach(btn => {

            btn.disabled = true;

        });


    updateStatus();

}


/* =========================================
   STATUS
   ========================================= */

function updateStatus(){

    const available =
        8 - usedNumbers.length;


    document
        .getElementById("status")
        .textContent =
        available > 0
        ? available + " numbers available"
        : "All numbers have been selected.";

}

</script>

</body>
</html>
